<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RamGuard</title>
  <link rel="stylesheet" href="ui-base.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="icons/icon48.png" alt="RamGuard">
      <div>
        <div class="brand-title">RamGuard</div>
        <div class="brand-sub">Zero-bloat MV3 tab suspender</div>
      </div>
    </div>
    <button class="tier-pill" id="tierPill">FREE</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="dash">Dashboard</button>
    <button class="tab-btn" data-tab="whitelist">Whitelist</button>
    <button class="tab-btn" data-tab="pro">Pro</button>
  </nav>

  <main>
    <section class="panel active" id="panel-dash">
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-val" id="suspendedNow">0</div>
          <div class="stat-lbl">Suspended Tabs</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="ramSaved">0 MB</div>
          <div class="stat-lbl">Est. RAM Freed Now</div>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <button class="btn btn-primary btn-sm" id="suspendOthersBtn" style="flex:1;padding:9px;">⚡ Suspend Other Tabs</button>
          <button class="btn btn-sm" id="wakeAllBtn" style="padding:9px;">Wake All</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Auto-Suspend Engine</div>
        <div class="row">
          <span>Auto-suspend inactive tabs</span>
          <label class="switch"><input type="checkbox" id="autoSuspendToggle"><span class="slider"></span></label>
        </div>
        <div class="row" style="margin-top:8px;">
          <span>Idle timeout</span>
          <select id="idleSelect" style="width:130px;">
            <option value="5">5 minutes</option>
            <option value="15">15 minutes</option>
            <option value="20">20 minutes</option>
            <option value="30">30 minutes</option>
            <option value="60">1 hour</option>
            <option value="120">2 hours</option>
          </select>
        </div>
        <div class="row">
          <span>Protect pinned tabs</span>
          <label class="switch"><input type="checkbox" id="protectPinnedToggle"><span class="slider"></span></label>
        </div>
        <div class="row">
          <span>Protect audio / video tabs</span>
          <label class="switch"><input type="checkbox" id="protectAudibleToggle"><span class="slider"></span></label>
        </div>
      </div>
    </section>

    <section class="panel" id="panel-whitelist">
      <div class="card">
        <div class="card-title">Never Suspend Domains</div>
        <div class="row">
          <input type="text" id="wlInput" placeholder="e.g. docs.google.com or slack.com">
          <button class="btn btn-primary btn-sm" id="addWlBtn">Add</button>
        </div>
        <div class="row" style="margin-top:7px;">
          <button class="btn btn-sm" id="wlCurrentBtn" style="flex:1;">+ Whitelist Current Tab</button>
          <label style="display:flex;align-items:center;gap:4px;font-size:11px;">
            <input type="checkbox" id="wlRegexCb"> Regex <span class="pro-tag">PRO</span>
          </label>
        </div>
      </div>
      <div class="list" id="wlList"></div>
    </section>

    <section class="panel" id="panel-pro"></section>
  </main>

  <div class="toast" id="toast"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
